<div style="padding: 20px; font-family: sans-serif; max-width: 400px;">
  <h2>Cadastrar Novo Livro ➕</h2>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    
    <label>Título:</label>
    <input type="text" [(ngModel)]="livro.titulo" placeholder="Ex: O Hobbit">

    <label>Autor:</label>
    <input type="text" [(ngModel)]="livro.autor" placeholder="Ex: J.R.R. Tolkien">

    <div class="form-group">
      <label for="generos">Gêneros</label>
      <ng-select 
        [items]="listaGeneros" 
        bindLabel="nome" 
        bindValue="id" 
        [multiple]="true" 
        placeholder="Selecione ou digite um gênero"
        [(ngModel)]="livro.generosIds" 
        name="generos"
        [addTag]="criarNovoGenero"
        addTagText="Adicionar novo gênero: ">
      </ng-select>
    </div>

    <label>URL da Capa:</label>
    <input type="text" [(ngModel)]="livro.imageurl" placeholder="Link da imagem">

    <div style="display: flex; gap: 20px; margin-top: 10px;">
      <label>
        <input type="checkbox" [(ngModel)]="livro.lido"> Já li
      </label>
      
      <label>
        <input type="checkbox" [(ngModel)]="livro.emprestado"> Emprestado
      </label>
    </div>

    <button (click)="salvarLivro()" style="margin-top: 15px; padding: 10px; cursor: pointer;">
      Salvar Livro
    </button>

  </div>
</div>
